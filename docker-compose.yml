# ====================================
# IoT Remote Monitoring Dashboard — Docker Compose
# ====================================
# Development stack: TimescaleDB (PostgreSQL with time-series extension)
#
# Usage:
#   docker compose up -d        → Start database
#   docker compose down         → Stop database
#   docker compose down -v      → Stop and remove data volumes

version: "3.9"

services:
  # --- TimescaleDB (PostgreSQL + Time-Series) ---
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: iotdash-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iotdash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iotdash_dev}
      POSTGRES_DB: ${POSTGRES_DB:-iotdash_db}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iotdash -d iotdash_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
    driver: local
