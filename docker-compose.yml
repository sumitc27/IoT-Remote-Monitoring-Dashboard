# ====================================
# IoT Remote Monitoring Dashboard — Production Stack
# ====================================
# 
# Usage:
#   docker-compose up -d --build
#
# Services:
# - timescaledb: PostgreSQL + Time-Series extension
# - backend: FastAPI Python application (uvicorn)
# - frontend: React/Vite build
# - nginx: Reverse proxy for routing traffic to frontend and backend
# ====================================

services:
  # --- TimescaleDB (PostgreSQL + Time-Series) ---
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: iotdash-timescaledb
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iotdash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iotdash_dev}
      POSTGRES_DB: ${POSTGRES_DB:-iotdash_db}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iotdash -d iotdash_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iot-network

  # --- FastAPI Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iotdash-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-iotdash}:${POSTGRES_PASSWORD:-iotdash_dev}@timescaledb:5432/${POSTGRES_DB:-iotdash_db}
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - iot-network

  # --- React Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iotdash-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - iot-network

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: iotdash-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - iot-network

volumes:
  timescaledb_data:
    driver: local

networks:
  iot-network:
    driver: bridge
